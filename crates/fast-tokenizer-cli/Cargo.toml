[package]
name = "fast-tokenizer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface for the fast byte-level BPE tokenizer"

[[bin]]
name = "fast-tokenizer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fast-tokenizer = { path = "../fast-tokenizer" }
serde_json = "1.0"
